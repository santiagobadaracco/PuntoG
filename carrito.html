<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Punto G | Carrito</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    background: #0d0b0d;

    color: #f5eef2;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    line-height: 1.5;
}

a {
    text-decoration: none;
    color: inherit;
}

/* HEADER */

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    background:
        rgba(13,11,13,0.97);

    border-bottom:
        1px solid #30242b;

    backdrop-filter:
        blur(10px);
}

.nav {

    max-width: 1200px;

    height: 74px;

    margin: auto;

    padding: 0 25px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.logo {

    font-family: Georgia, serif;

    font-size: 25px;

    font-weight: bold;

    letter-spacing: 3px;
}

.logo span {
    color: #d94a75;
}

nav {

    display: flex;

    gap: 28px;
}

nav a {

    color: #eee;

    font-size: 14px;
}

nav a:hover {
    color: #d94a75;
}

/* CONTENEDOR */

.cart-page {

    max-width: 1100px;

    margin: auto;

    padding: 70px 20px 100px;
}

.cart-title {

    text-align: center;

    margin-bottom: 45px;
}

.cart-title h1 {

    font-family: Georgia, serif;

    font-size: 42px;

    margin-bottom: 10px;
}

.cart-title p {

    color: #aaa0a6;
}

/* CARRITO */

.cart-layout {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        330px;

    gap: 30px;

    align-items: start;
}

/* PRODUCTOS */

.cart-items {

    display: flex;

    flex-direction: column;

    gap: 15px;
}

.cart-item {

    background: #151115;

    border: 1px solid #30242b;

    border-radius: 14px;

    padding: 18px;

    display: grid;

    grid-template-columns:
        100px
        minmax(0, 1fr)
        auto;

    gap: 20px;

    align-items: center;
}

.cart-item img {

    width: 100px;

    height: 100px;

    object-fit: contain;

    background:
        #100d10;

    border-radius: 10px;
}

.cart-item h3 {

    font-family: Georgia, serif;

    font-size: 18px;

    margin-bottom: 6px;
}

.unit-price {

    color: #aaa0a6;

    font-size: 13px;
}

/* CANTIDAD */

.quantity {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 12px;
}

.quantity button {

    width: 30px;

    height: 30px;

    border-radius: 6px;

    border:
        1px solid #74374c;

    background: transparent;

    color: white;

    cursor: pointer;
}

.quantity button:hover {

    background: #d94a75;
}

.quantity span {

    min-width: 25px;

    text-align: center;

    font-weight: bold;
}

/* SUBTOTAL */

.item-total {

    text-align: right;
}

.item-total strong {

    display: block;

    font-size: 19px;

    margin-bottom: 8px;
}

.remove {

    border: none;

    background: transparent;

    color: #a99da4;

    cursor: pointer;

    font-size: 12px;
}

.remove:hover {

    color: #d94a75;
}

/* RESUMEN */

.summary {

    background: #151115;

    border: 1px solid #30242b;

    border-radius: 15px;

    padding: 25px;

    position: sticky;

    top: 100px;
}

.summary h2 {

    font-family: Georgia, serif;

    font-size: 25px;

    margin-bottom: 25px;
}

.summary-row {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    color: #aaa0a6;
}

.summary-total {

    display: flex;

    justify-content: space-between;

    padding-top: 20px;

    margin-top: 10px;

    border-top:
        1px solid #30242b;

    font-size: 21px;

    font-weight: bold;
}

.checkout {

    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border: none;

    border-radius: 8px;

    background: #d94a75;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.checkout:hover {

    background: #ed628c;
}

.continue {

    display: block;

    text-align: center;

    margin-top: 18px;

    color: #aaa0a6;

    font-size: 13px;
}

.continue:hover {

    color: #d94a75;
}

/* CARRITO VACIO */

.empty {

    text-align: center;

    padding: 100px 20px;

    background: #151115;

    border:
        1px solid #30242b;

    border-radius: 15px;
}

.empty h2 {

    font-family: Georgia, serif;

    font-size: 30px;

    margin-bottom: 15px;
}

.empty p {

    color: #aaa0a6;

    margin-bottom: 25px;
}

.empty a {

    display: inline-block;

    background: #d94a75;

    padding: 13px 25px;

    border-radius: 8px;

    font-weight: bold;
}

/* FOOTER */

footer {

    padding: 55px 20px;

    text-align: center;

    color: #81767d;

    font-size: 13px;
}

footer strong {

    color: #f5eef2;

    letter-spacing: 2px;
}

/* RESPONSIVE */

@media (max-width: 800px) {

    nav {
        display: none;
    }

    .cart-layout {

        grid-template-columns: 1fr;
    }

    .summary {

        position: static;
    }

}

@media (max-width: 550px) {

    .cart-item {

        grid-template-columns:
            80px
            minmax(0,1fr);

    }

    .cart-item img {

        width: 80px;

        height: 80px;
    }

    .item-total {

        grid-column: 2;

        text-align: left;

        margin-top: 5px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<div class="nav">

<a
    href="index.html"
    class="logo"
>
PUNTO <span>G</span>
</a>

<nav>

<a href="index.html">
Inicio
</a>

<a href="index.html#catalogo">
Catálogo
</a>

<a href="carrito.html">
🛒 Carrito
</a>

</nav>

</div>

</header>


<!-- CONTENIDO -->

<main class="cart-page">

<div class="cart-title">

<h1>
Tu carrito
</h1>

<p>
Revisá tus productos antes de continuar.
</p>

</div>


<div id="cartContent">

</div>

</main>


<footer>

<strong>
PUNTO G SEX SHOP
</strong>

<br><br>

Tu placer tiene un punto.

<br><br>

WhatsApp: 11 2647-3370

<br><br>

© 2026 Punto G Sex Shop

</footer>


<script>

/* ==================================================
   CARGAR CARRITO
================================================== */

function obtenerCarrito() {

    return JSON.parse(
        localStorage.getItem(
            "carrito"
        )
    ) || [];

}


/* ==================================================
   GUARDAR CARRITO
================================================== */

function guardarCarrito(carrito) {

    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );

}


/* ==================================================
   FORMATEAR PRECIO
================================================== */

function precio(valor) {

    return "$" +
        Number(valor).toLocaleString(
            "es-AR"
        );

}


/* ==================================================
   MOSTRAR CARRITO
================================================== */

function mostrarCarrito() {

    const carrito =
        obtenerCarrito();

    const container =
        document.getElementById(
            "cartContent"
        );


    /* CARRITO VACIO */

    if (carrito.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    Tu carrito está vacío
                </h2>

                <p>
                    Todavía no agregaste
                    ningún producto.
                </p>

                <a href="index.html#catalogo">
                    Ver catálogo
                </a>

            </div>

        `;

        return;

    }


    let subtotalGeneral = 0;


    let productosHTML = "";


    carrito.forEach(
        function(item, index) {


            const subtotal =
                Number(item.precio) *
                Number(item.cantidad);


            subtotalGeneral +=
                subtotal;


            productosHTML += `

                <article
                    class="cart-item"
                >

                    <img
                        src="${item.imagen}"
                        alt="${item.nombre}"
                    >

                    <div>

                        <h3>
                            ${item.nombre}
                        </h3>

                        <div class="unit-price">

                            Precio unitario:
                            ${precio(item.precio)}

                        </div>


                        <div class="quantity">

                            <button
                                onclick="cambiarCantidad(${index}, -1)"
                            >
                                −
                            </button>

                            <span>
                                ${item.cantidad}
                            </span>

                            <button
                                onclick="cambiarCantidad(${index}, 1)"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <div class="item-total">

                        <strong>
                            ${precio(subtotal)}
                        </strong>

                        <button
                            class="remove"
                            onclick="eliminarProducto(${index})"
                        >
                            Eliminar
                        </button>

                    </div>

                </article>

            `;

        }
    );


    container.innerHTML = `

        <div class="cart-layout">


            <div class="cart-items">

                ${productosHTML}

            </div>


            <aside class="summary">

                <h2>
                    Resumen
                </h2>


                <div class="summary-row">

                    <span>
                        Productos
                    </span>

                    <span>
                        ${carrito.reduce(
                            (total, item) =>
                            total +
                            Number(item.cantidad),
                            0
                        )}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ${precio(subtotalGeneral)}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Envío
                    </span>

                    <span>
                        A coordinar
                    </span>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ${precio(subtotalGeneral)}
                    </span>

                </div>


                <button
                    class="checkout"
                    onclick="finalizarCompra()"
                >
                    Finalizar compra
                </button>


                <a
                    href="index.html#catalogo"
                    class="continue"
                >
                    ← Seguir comprando
                </a>

            </aside>

        </div>

    `;

}


/* ==================================================
   CAMBIAR CANTIDAD
================================================== */

function cambiarCantidad(
    index,
    cambio
) {

    const carrito =
        obtenerCarrito();


    carrito[index].cantidad +=
        cambio;


    if (
        carrito[index].cantidad <= 0
    ) {

        carrito.splice(index, 1);

    }


    guardarCarrito(carrito);

    mostrarCarrito();

}


/* ==================================================
   ELIMINAR PRODUCTO
================================================== */

function eliminarProducto(index) {

    const carrito =
        obtenerCarrito();


    carrito.splice(index, 1);


    guardarCarrito(carrito);

    mostrarCarrito();

}


/* ==================================================
   FINALIZAR COMPRA
================================================== */

function finalizarCompra() {

    const carrito =
        obtenerCarrito();


    if (carrito.length === 0) {

        return;

    }


    let mensaje =
        "Hola! Quiero realizar una compra en Punto G Sex Shop.%0A%0A";


    carrito.forEach(
        function(item) {

            const subtotal =
                item.precio *
                item.cantidad;


            mensaje +=
                "• " +
                item.nombre +
                " x" +
                item.cantidad +
                " - " +
                precio(subtotal) +
                "%0A";

        }
    );


    const total =
        carrito.reduce(
            function(
                suma,
                item
            ) {

                return suma +
                    (
                        item.precio *
                        item.cantidad
                    );

            },
            0
        );


    mensaje +=
        "%0ATotal: " +
        precio(total);


    const telefono =
        "5491126473370";


    window.open(
        "https://wa.me/" +
        telefono +
        "?text=" +
        mensaje,
        "_blank"
    );

}


/* ==================================================
   INICIAR
================================================== */

mostrarCarrito();

</script>

</body>

</html>
