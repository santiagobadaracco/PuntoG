            100000,

        ],

        descripcion:
            "Sex Therapy ANA 5 con funciones de succión y vibración. Es recargable y cuenta con diferentes modos de vibración.",

        caracteristicas: [

            "Succión + vibración",

            "10 modos de vibración",

            "Control: 1 pila CR2032 no incluida"

        ]

    }

};


/* ==================================================
   OBTENER PRODUCTO DE LA URL
================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const id =
    parametros.get("id");


const producto =
    productos[id];


/* ==================================================
   SI NO EXISTE
================================================== */

if (!producto) {

    document.getElementById(
        "productContainer"
    ).innerHTML = `

        <div style="
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 20px;
        ">

            <h1>
                Producto no encontrado
            </h1>

            <br>

            <a
                href="index.html#catalogo"
                style="color:#d94a75;"
            >
                Volver al catálogo
            </a>

        </div>

    `;

} else {

    cargarProducto(producto);

}


/* ==================================================
   CARGAR PRODUCTO
================================================== */

function cargarProducto(producto) {

    document.title =
        producto.nombre +
        " | Punto G";


    document.getElementById(
        "productName"
    ).textContent =
        producto.nombre;


    document.getElementById(
        "productCategory"
    ).textContent =
        producto.categoria;


    document.getElementById(
        "productPrice"
    ).textContent =
        "$" +
        producto.precio.toLocaleString(
            "es-AR"
        );


    document.getElementById(
        "productDescription"
    ).textContent =
        producto.descripcion;


    /* GALERIA */

    const gallery =
        document.getElementById(
            "productGallery"
        );


    producto.imagenes.forEach(
        function(imagen, index) {

            const img =
                document.createElement("img");

            img.src = imagen;

            img.alt =
                producto.nombre;

            if (index === 0) {

                img.classList.add(
                    "active"
                );

            }

            gallery.appendChild(img);

        }
    );


    /* BOTONES GALERIA */

    if (producto.imagenes.length > 1) {

        const prev =
            document.createElement("button");

        prev.className =
            "gallery-button prev";

        prev.innerHTML = "‹";

        prev.onclick =
            function() {

                cambiarImagen(-1);

            };


        const next =
            document.createElement("button");

        next.className =
            "gallery-button next";

        next.innerHTML = "›";

        next.onclick =
            function() {

                cambiarImagen(1);

            };


        gallery.appendChild(prev);

        gallery.appendChild(next);


        /* DOTS */

        const dots =
            document.createElement("div");

        dots.className = "dots";


        producto.imagenes.forEach(
            function(imagen, index) {

                const dot =
                    document.createElement("span");

                dot.className = "dot";

                if (index === 0) {

                    dot.classList.add(
                        "active"
                    );

                }

                dots.appendChild(dot);

            }
        );


        gallery.appendChild(dots);

    }


    /* CARACTERISTICAS */

    const features =
        document.getElementById(
            "productFeatures"
        );


    let html = `
        <h3>Características</h3>
        <ul>
    `;


    producto.caracteristicas.forEach(
        function(item) {

            html += `
                <li>
                    ${item}
                </li>
            `;

        }
    );


    html += `
        </ul>
    `;


    features.innerHTML = html;

}


/* ==================================================
   CAMBIAR IMAGEN
================================================== */

function cambiarImagen(direction) {

    const gallery =
        document.getElementById(
            "productGallery"
        );


    const images =
        gallery.querySelectorAll(
            "img"
        );


    const dots =
        gallery.querySelectorAll(
            ".dot"
        );


    let current = 0;


    images.forEach(
        function(image, index) {

            if (
                image.classList.contains(
                    "active"
                )
            ) {

                current = index;

            }

        }
    );


    images[current].classList.remove(
        "active"
    );


    if (dots[current]) {

        dots[current].classList.remove(
            "active"
        );

    }


    current += direction;


    if (current >= images.length) {

        current = 0;

    }


    if (current < 0) {

        current =
            images.length - 1;

    }


    images[current].classList.add(
        "active"
    );


    if (dots[current]) {

        dots[current].classList.add(
            "active"
        );

    }

}


/* ==================================================
   AGREGAR AL CARRITO
================================================== */

function agregarAlCarrito() {

    if (!producto) {

        return;

    }


    let carrito =
        JSON.parse(
            localStorage.getItem(
                "carrito"
            )
        ) || [];


    const existente =
        carrito.find(
            function(item) {

                return item.id === producto.id;

            }
        );


    if (existente) {

        existente.cantidad += 1;

    } else {

        carrito.push({

            id: producto.id,

            nombre: producto.nombre,

            precio: producto.precio,

            imagen: producto.imagenes[0],

            cantidad: 1

        });

    }


    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );


    window.location.href =
        "carrito.html";

}
