/* =====================================================
   GALERIA
===================================================== */

let imagenActual = 0;


function seleccionarImagen(indice) {

    const imagenes =
        document.querySelectorAll(
            ".main-image img"
        );

    const miniaturas =
        document.querySelectorAll(
            ".thumbnail"
        );


    if (
        !imagenes.length
    ) {
        return;
    }


    imagenActual = indice;


    if (
        imagenActual >= imagenes.length
    ) {

        imagenActual = 0;

    }


    if (
        imagenActual < 0
    ) {

        imagenActual =
            imagenes.length - 1;

    }


    imagenes.forEach(
        function(imagen, index) {

            imagen.classList.toggle(
                "active",
                index === imagenActual
            );

        }
    );


    miniaturas.forEach(
        function(miniatura, index) {

            miniatura.classList.toggle(
                "active",
                index === imagenActual
            );

        }
    );

}


function cambiarImagen(direccion) {

    seleccionarImagen(
        imagenActual + direccion
    );

}


/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

function agregarAlCarrito() {

    const id =
        obtenerProductoId();

    const producto =
        productos[id];


    if (!producto) {
        return;
    }


    let carrito =
        JSON.parse(
            localStorage.getItem(
                "puntoGCarrito"
            )
        ) || [];


    const existente =
        carrito.find(
            function(item) {

                return item.id === producto.id;

            }
        );


    if (existente) {

        existente.cantidad += 1;

    } else {

        carrito.push({

            id:
                producto.id,

            nombre:
                producto.nombre,

            precio:
                producto.precio,

            imagen:
                producto.imagenes[0],

            cantidad:
                1

        });

    }


    localStorage.setItem(
        "puntoGCarrito",
        JSON.stringify(carrito)
    );


    actualizarContador();

    mostrarMensaje();

}


/* =====================================================
   CONTADOR
===================================================== */

function actualizarContador() {

    const carrito =
        JSON.parse(
            localStorage.getItem(
                "puntoGCarrito"
            )
        ) || [];


    const cantidad =
        carrito.reduce(
            function(total, producto) {

                return total +
                    producto.cantidad;

            },
            0
        );


    const contador =
        document.getElementById(
            "cartCount"
        );


    if (contador) {

        contador.textContent =
            cantidad;

    }

}

    setTimeout(

            mensaje.classList.remove(

            );

        },

}
